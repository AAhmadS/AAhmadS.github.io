      - generic [ref=f6e19]: "2024"
      - heading "LLaMA ClipViT — medical vision-language experiments" [level=1] [ref=f6e20]
      - paragraph [ref=f6e21]: "Six SOTA models, one lesson: benchmark the clinical question, not the leaderboard."
      - generic [ref=f6e22]:
        - generic [ref=f6e23]:
          - generic [ref=f6e24]:
            - paragraph [ref=f6e25]: I came into medical vision-language models the way a kid walks into a candy store. BLIVA, MedFlamingo, LLaVA-Med, MedVInT-TD, RadFM, CogVLM — every week a new state-of-the-art, and I wanted to run all of them on chest X-rays from the Indiana dataset, few-shot and fine-tuned, with TextGrad experiments on top. The harness worked. The benchmark table grew. And then I looked at the table and realized I could not tell you which result mattered for a single real clinical decision.
            - paragraph [ref=f6e26]: "That stung, because the engineering was genuinely good: Hugging Face pipelines, clean few-shot protocols, aggregated SOTA comparisons. I had built a machine for producing numbers and forgotten to decide which number would change anyone’s mind. It was the mirror image of Emo3D, where inventing the right metric was the whole contribution — here I had six models and no metric of my own."
            - paragraph [ref=f6e27]: "So this one sits in Regrets, not because it failed, but because it taught me the rule I now enforce everywhere: decide the question before running the model. My Option Lab has 179 tests because of ClipViT. My voice-agent benches measure farm-domain error rates because ClipViT taught me that embedding distance is not task performance."
          - generic [ref=f6e28]:
            - generic [ref=f6e29]: What I regret
            - paragraph [ref=f6e30]: I chased breadth — six models, three protocols — instead of depth on one clinical question with one metric I believed in. Benchmark-chasing felt like progress and was not.
